name: andina-market

services:
  db:
    image: postgres:16.6-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  usuarios:
    build: ./services/usuarios
    environment:
      DATABASE_URL: postgresql+psycopg://svc_usuarios:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRA_MIN: ${JWT_EXPIRA_MIN}
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  inventario:
    build: ./services/inventario
    environment:
      DATABASE_URL: postgresql+psycopg://svc_inventario:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SERVICE_TOKEN: ${SERVICE_TOKEN}
    ports:
      - "8004:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  productos:
    build: ./services/productos
    environment:
      DATABASE_URL: postgresql+psycopg://svc_catalogo:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      PUBLIC_BASE_URL: https://localhost:8443
    volumes:
      - objetos:/data/objetos
    ports:
      - "8002:8000"
    depends_on:
      db:
        condition: service_healthy
      inventario:
        condition: service_started
    restart: unless-stopped

  pedidos:
    build: ./services/pedidos
    environment:
      DATABASE_URL: postgresql+psycopg://svc_pedidos:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      PAGO_FALLA_PCT: "10"
    depends_on:
      db:
        condition: service_healthy
      productos:
        condition: service_started
      inventario:
        condition: service_started
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certs:/etc/nginx/certs
    ports:
      - "8080:8080"
      - "8443:8443"
    healthcheck:
      test: ["CMD", "wget", "-q", "--no-check-certificate", "-O", "/dev/null", "https://127.0.0.1:8443/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      - usuarios
      - productos
      - inventario
      - pedidos
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./observabilidad/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observabilidad/alertas.yml:/etc/prometheus/alertas.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/dashboard.json
    volumes:
      - ./observabilidad/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observabilidad/grafana/dashboard.json:/var/lib/grafana/dashboards/dashboard.json:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  k6:
    image: grafana/k6:0.55.0
    profiles: [carga]
    environment:
      EMAIL: cliente1@example.com
      PASSWORD: ${SEED_USUARIOS_PASSWORD}
    volumes:
      - ./pruebas/carga:/pruebas:ro
    networks:
      default:
        ipv4_address: 172.28.0.250  # IP fuera del rate limit del gateway (nginx/nginx.conf)

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  certs:
  pgdata:
  objetos:
