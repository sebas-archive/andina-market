# Gateway de AndinaMarket: equivalente local del ALB (Tareas 4.3-4.5).
events {
    # El valor por defecto (512) se agotó en la prueba de carga (docs/evidencias/f4-07, primera corrida).
    worker_connections 4096;
}

http {
    # DNS interno de Docker con validez corta: al escalar un servicio, Nginx ve las réplicas nuevas.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Rate limit por IP: 10 req/s con ráfaga de 20. En producción el umbral se ajusta al tráfico real
    # por usuario (WAF/ALB). El generador de carga k6 (172.28.0.250) queda fuera del límite para poder
    # medir la capacidad de los servicios, como una lista de permitidos del WAF.
    geo $sin_limite {
        default         0;
        172.28.0.250    1;
    }
    map $sin_limite $clave_limite {
        0 $binary_remote_addr;
        1 "";
    }
    limit_req_zone $clave_limite zone=por_ip:10m rate=10r/s;
    limit_req_status 429;

    log_format conupstream '$remote_addr "$request" $status $request_time upstream=$upstream_addr';
    access_log /var/log/nginx/access.log conupstream;

    proxy_connect_timeout 5s;
    proxy_send_timeout    5s;
    proxy_read_timeout    5s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 5m;

    server {
        listen 8080;
        return 301 https://$host:8443$request_uri;
    }

    server {
        listen 8443 ssl;
        ssl_certificate     /etc/nginx/certs/localhost.crt;
        ssl_certificate_key /etc/nginx/certs/localhost.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        limit_req zone=por_ip burst=20 nodelay;
        error_page 429 = @limite;

        location @limite {
            default_type application/json;
            return 429 '{"error":"demasiadas_solicitudes","detalle":"Supera 10 req/s por IP."}';
        }

        location = /health {
            default_type application/json;
            return 200 '{"status":"ok","servicio":"gateway"}';
        }

        # Endpoints internos de inventario: solo entre servicios, nunca desde Internet.
        location ~ ^/api/inventario/[^/]+/(reservar|liberar)$ {
            default_type application/json;
            return 403 '{"error":"prohibido","detalle":"Endpoint interno."}';
        }

        location /api/usuarios {
            set $upstream_usuarios usuarios:8000;
            proxy_pass http://$upstream_usuarios;
        }

        location /api/productos {
            set $upstream_productos productos:8000;
            proxy_pass http://$upstream_productos;
        }

        location /api/pedidos {
            set $upstream_pedidos pedidos:8000;
            proxy_pass http://$upstream_pedidos;
        }

        location /api/inventario {
            set $upstream_inventario inventario:8000;
            proxy_pass http://$upstream_inventario;
        }
    }
}
