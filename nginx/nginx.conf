# Gateway de AndinaMarket: equivalente local del ALB (Tarea 4.3; se completa en 4.4 y 4.5).
events {}

http {
    # DNS interno de Docker con validez corta: al escalar un servicio, Nginx ve las réplicas nuevas.
    resolver 127.0.0.11 valid=5s ipv6=off;

    proxy_connect_timeout 5s;
    proxy_send_timeout    5s;
    proxy_read_timeout    5s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 5m;

    server {
        listen 8080;

        location = /health {
            default_type application/json;
            return 200 '{"status":"ok","servicio":"gateway"}';
        }

        # Endpoints internos de inventario: solo entre servicios, nunca desde Internet.
        location ~ ^/api/inventario/[^/]+/(reservar|liberar)$ {
            default_type application/json;
            return 403 '{"error":"prohibido","detalle":"Endpoint interno."}';
        }

        location /api/usuarios {
            set $upstream_usuarios usuarios:8000;
            proxy_pass http://$upstream_usuarios;
        }

        location /api/productos {
            set $upstream_productos productos:8000;
            proxy_pass http://$upstream_productos;
        }

        location /api/pedidos {
            set $upstream_pedidos pedidos:8000;
            proxy_pass http://$upstream_pedidos;
        }

        location /api/inventario {
            set $upstream_inventario inventario:8000;
            proxy_pass http://$upstream_inventario;
        }
    }
}
